
# ==========================================
# DATA ENGINEERING - ARESEP
# PostgreSQL 17 con Docker Compose
# ==========================================

services:

  db:
    image: postgres:17

    container_name: ice-postgres

    restart: unless-stopped

    # Configuracion desde .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    # Conexion desde Windows
    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:

      # Persistencia de PostgreSQL
      - postgres_data:/var/lib/postgresql/data

      # Inicializacion automatica
      # Solo al crear una BD desde cero
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro


# ==========================================
# VOLUMEN PERSISTENTE
# ==========================================

volumes:
  postgres_data:
